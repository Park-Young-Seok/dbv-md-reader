name: Release Linux

# Construye los paquetes .deb y .AppImage para Linux y los adjunta como
# borrador de GitHub Release en cada tag vX.Y.Z. El flujo de Windows sigue
# siendo manual (ver README.md, sección "Publicar una nueva Release") — este
# workflow crea/actualiza el mismo borrador para que el maintainer solo tenga
# que subir los 3 ficheros de Windows encima y pulsar "Publish".
#
# La versión se lee de src-tauri/tauri.conf.json (no de github.ref_name):
# permite lanzar este workflow a mano (workflow_dispatch) sobre `master` para
# adjuntar los artefactos de Linux a una Release cuyo tag ya existe (p.ej. si
# la versión no cambió respecto al último tag, como decidió el proyecto para
# la 0.7.0 — ver ADR-019 en dbv-specs-ops/memory.md), sin depender de que se
# empuje un tag nuevo.
#
# El input `draft` (solo aplica a workflow_dispatch; en un push de tag siempre
# es "true") controla si se busca/crea un borrador o si se añade directamente
# a una Release ya publicada. tauri-action *falla* si le pides "true" y solo
# existe una Release publicada con ese tag (no la toca, simplemente no la
# encuentra) — así que para una versión que ya se publicó a mano (como
# v0.7.0), hay que lanzarlo con `draft: false` explícitamente.
#
# Sin auto-actualización en Linux por ahora (deuda técnica consciente, ver
# dbv-specs-ops/memory.md): no se pasan las variables TAURI_SIGNING_*, así que
# no se genera .sig ni se sube manifiesto de updater para esta plataforma.
# `createUpdaterArtifacts: false` en tauri.linux.conf.json es imprescindible
# para esto — sin él, `tauri build` termina en exit 1 ("se ha encontrado una
# clave pública pero no la privada") aunque el .deb/.AppImage se generen bien,
# el mismo problema ya documentado para Windows en la Lección 16 de memory.md.
#
# `releaseBody` (bug real corregido 2026-09-22): tauri-action lo deja vacío
# si no se le pasa nada — v0.16.0 y v0.17.0 salieron sin texto explicativo en
# la Release (v0.14.0 sí lo tenía, pero porque se escribió a mano una vez y
# no se repitió después). `scripts/extract-changelog-entry.mjs` extrae la
# sección de la versión actual de `dbv-specs-ops/CHANGELOG.md` para que el
# cuerpo de la Release salga siempre relleno, sin depender de que alguien se
# acuerde de pegarlo a mano. `release-macos.yml` hace lo mismo — como ambos
# workflows disparan sobre el mismo tag y computan el mismo texto, no importa
# cuál de los dos actualice el cuerpo de la Release al final.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      draft:
        description: >
          "true" (normal): crea/usa un borrador para esa versión, a completar a mano con
          los ficheros de Windows antes de publicar. "false": la Release de esa versión ya
          existe PUBLICADA (como v0.7.0) y solo quieres añadirle los artefactos de Linux,
          sin tocar su estado ni crear un borrador nuevo.
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    # El GITHUB_TOKEN por defecto del repo es de solo lectura (Settings → Actions →
    # Workflow permissions), así que sin esto tauri-action falla al subir los
    # artefactos con "Resource not accessible by integration". Se concede permiso
    # de escritura solo a este workflow, no al valor por defecto de todo el repo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Leer versión de tauri.conf.json
        id: version
        run: echo "tag=v$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determinar si la Release debe crearse/tratarse como borrador
        id: draft
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar dependencias del sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Instalar dependencias de Node
        run: npm install

      - name: Extraer notas de la versión desde CHANGELOG.md
        id: changelog
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node scripts/extract-changelog-entry.mjs
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build y Release (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: ${{ steps.version.outputs.tag }}
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: ${{ steps.draft.outputs.value }}
          prerelease: false
          includeUpdaterJson: false

      # linuxdeploy (dentro de `tauri build`) deja `AppRun.wrapped` con permisos
      # 0770 y todo el squashfs pertenece a root. En un escritorio no se nota
      # porque el runtime FUSE monta los ficheros con el uid del usuario, pero
      # quien lo ejecuta como "otros" (el test con firejail del catálogo de
      # AppImageHub, PR AppImage/appimage.github.io#6058) recibe "Permission
      # denied" y la app no arranca. Se extrae, se normalizan los permisos, se
      # reempaqueta con el mismo nombre y se sustituye el asset que tauri-action
      # ya había subido. El .deb no se toca.
      - name: Normalizar permisos del AppImage y resubirlo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          set -euo pipefail
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          work=$(mktemp -d)
          cp "$appimage" "$work/original.AppImage"
          chmod +x "$work/original.AppImage"
          (cd "$work" && ./original.AppImage --appimage-extract >/dev/null)
          chmod -R u+rwX,go+rX,go-w "$work/squashfs-root"

          wget -q -O "$work/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$work/appimagetool"
          "$work/appimagetool" -n "$work/squashfs-root" "$appimage"

          # Verificación sobre el AppImage ya reempaquetado, no sobre el directorio.
          check=$(mktemp -d)
          (cd "$check" && "$OLDPWD/$appimage" --appimage-extract >/dev/null)
          ls -l "$check/squashfs-root/AppRun" "$check/squashfs-root/AppRun.wrapped" "$check/squashfs-root/usr/bin/"
          bad=$(find "$check/squashfs-root" -type f \( ! -perm -o+r -o -perm -o+w \))
          if [ -n "$bad" ] || [ ! -x "$check/squashfs-root/AppRun.wrapped" ] \
             || find "$check/squashfs-root/AppRun.wrapped" ! -perm -o+x | grep -q .; then
            echo "::error::El AppImage reempaquetado sigue con permisos incorrectos:"
            echo "$bad"
            exit 1
          fi

          # GitHub cambia los espacios del nombre por puntos al subir el asset
          # ("DBV.Markdown.Reader_…"); --clobber solo reemplaza si el nombre local
          # ya coincide con ese.
          upload="$work/$(basename "$appimage" | tr ' ' '.')"
          cp "$appimage" "$upload"
          gh release upload "${{ steps.version.outputs.tag }}" "$upload" --clobber
